name: Sahne Denemesi
on:
  push:
    branches: [sahne-test]
    paths: ["deneme/sahne_test.py", ".github/workflows/sahne-test.yml"]
permissions:
  contents: write
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install gradio_client
      - run: python deneme/sahne_test.py
      - name: Sonucu dala yaz
        if: always()
        run: |
          git config user.name "turksopranos-robot"
          git config user.email "robot@users.noreply.github.com"
          git add deneme/cikti || true
          git commit -m "Sahne denemesi sonucu" && git push || echo "cikti yok"
