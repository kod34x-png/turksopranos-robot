name: Sahne Denemesi
on:
  push:
    branches: [sahne-test]
    paths: ["deneme/sahne_test.py", ".github/workflows/sahne-test.yml"]
permissions:
  contents: write
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install gradio_client faster-whisper
      - run: python deneme/sahne_test.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Sesi yaziya dok
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY' | tee deneme/cikti/yazi.txt
          import glob
          from faster_whisper import WhisperModel
          m = WhisperModel("small", compute_type="int8")
          for w in sorted(glob.glob("deneme/cikti/ses*.wav")):
              print(w, " ".join(s.text for s in m.transcribe(w, language="tr")[0]))
          PY
      - name: Sonucu dala yaz
        if: always()
        run: |
          git config user.name "turksopranos-robot"
          git config user.email "robot@users.noreply.github.com"
          git add deneme/cikti || true
          git commit -m "Sahne denemesi sonucu" && git pull --rebase && git push || echo "cikti yok"
