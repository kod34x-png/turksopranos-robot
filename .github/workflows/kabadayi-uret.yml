name: Kabadayi Uretim
# Persembe 10:00 (Turkiye) uretir, Cuma ayni saatte eksik kaldiysa devam eder.
on:
  schedule:
    - cron: "0 7 * * 4,5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kabadayi-uret
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy pillow gradio_client edge-tts
      - name: Uret
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python robot/kabadayi_uret.py
      - name: Depoya koy
        if: always()
        run: |
          git config user.name "turksopranos-robot"
          git config user.email "robot@users.noreply.github.com"
          git add medya/kabadayi && git commit -qm "Kabadayi uretim" && git pull -q --rebase && git push -q || echo "degisiklik yok"
