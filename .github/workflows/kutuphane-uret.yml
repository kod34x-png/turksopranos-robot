name: Kabadayi Kutuphane
# 15 Kasım 2026: her gün 09:00 (TR) ücretsiz ZeroGPU kotasıyla 3 kare + 1 klip üretir (kota biterse durur).
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kabadayi-kutuphane
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q gradio_client
      - name: Uret
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python robot/kutuphane_uret.py
      - name: Depoya koy
        if: always()
        run: |
          git config user.name "turksopranos-robot"
          git config user.email "robot@users.noreply.github.com"
          git add medya/kabadayi && git commit -qm "Kabadayi kutuphane" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
