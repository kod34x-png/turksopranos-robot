name: FON DIP Gorsel
# 21 Kasım 2026: tek seferlik "FON / DİP" videosu için görsel üretimi. Paylaşım yapmaz.
on:
  workflow_dispatch:
  push:
    paths: ["fondip/gorsel.py"]
permissions:
  contents: write
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q gradio_client
      - name: Uret
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python fondip/gorsel.py fondip/img
      - name: Depoya koy
        if: always()
        run: |
          git config user.name "turksopranos-robot"
          git config user.email "robot@users.noreply.github.com"
          git add fondip && git commit -qm "FON DIP gorseller" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
