name: Gunluk Yayin

on:
  schedule:
    - cron: "25 17 * * *"   # her gün 20:25 (Türkiye)
  workflow_dispatch:
  push:
    paths:
      - "robot/tetik.txt"    # bu dosya değişince hemen yayın yap

permissions:
  contents: write

concurrency:
  group: gunluk-yayin
  cancel-in-progress: false

jobs:
  yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy pillow

      - name: Bugünün içeriğini seç
        id: sec
        run: |
          python3 - <<'EOF'
          import json, os, datetime
          bugun = (datetime.datetime.utcnow() + datetime.timedelta(hours=3)).strftime("%Y-%m-%d")
          takvim = json.load(open("icerik/takvim.json", encoding="utf-8"))
          os.makedirs("durum", exist_ok=True)
          yol = "durum/yayinlanan.json"
          yapilan = json.load(open(yol)) if os.path.exists(yol) else []
          bitti = {y["tarih"] for y in yapilan if y.get("reel_id") and y.get("hikaye_id") and y.get("gonderi_id")}
          gun = next((g for g in takvim if g["tarih"] == bugun), None)
          if gun is None or bugun in bitti:
              print("Bugün için yayınlanacak içerik yok.")
              open(os.environ["GITHUB_OUTPUT"], "a").write("var=hayir\n")
          else:
              json.dump(gun, open("gun.json", "w", encoding="utf-8"), ensure_ascii=False)
              open(os.environ["GITHUB_OUTPUT"], "a").write(f"var=evet\ntarih={bugun}\n")
          EOF

      - name: Video ve kartı üret
        if: steps.sec.outputs.var == 'evet'
        run: python3 robot/uret.py gun.json cikti

      - name: Kartı ve videoyu depoya koy
        if: steps.sec.outputs.var == 'evet'
        id: medya
        run: |
          T=${{ steps.sec.outputs.tarih }}
          mkdir -p medya
          cp cikti/kart.jpg medya/$T-kart.jpg
          cp cikti/reel.mp4 medya/$T-reel.mp4
          git config user.name "turksopranos-robot"
          git config user.email "robot@users.noreply.github.com"
          git add medya/ && (git commit -qm "Medya $T" && git push -q || echo "medya zaten var")
          URL="https://raw.githubusercontent.com/${{ github.repository }}/main/medya/$T-kart.jpg"
          sleep 5
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL")" = "200" ]; then echo "kart=$URL" >> $GITHUB_OUTPUT; else echo "kart=" >> $GITHUB_OUTPUT; fi
          echo "video=https://raw.githubusercontent.com/${{ github.repository }}/main/medya/$T-reel.mp4" >> $GITHUB_OUTPUT

      - name: Instagram'a yayınla
        if: steps.sec.outputs.var == 'evet'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 robot/yayinla.py gun.json cikti "${{ steps.medya.outputs.kart }}" "${{ steps.medya.outputs.video }}"

      - name: Sonucu kaydet
        if: always() && steps.sec.outputs.var == 'evet'
        run: |
          python3 - <<'EOF'
          import json, os
          yol = "durum/yayinlanan.json"
          yapilan = json.load(open(yol)) if os.path.exists(yol) else []
          s = json.load(open("cikti/sonuc.json")) if os.path.exists("cikti/sonuc.json") else {"hata": "yayın adımı çalışmadı"}
          yapilan.append(s)
          json.dump(yapilan, open(yol, "w"), ensure_ascii=False, indent=1)
          print(json.dumps(s, ensure_ascii=False))
          EOF
          git pull -q --rebase
          git add durum/ && git commit -qm "Yayin sonucu ${{ steps.sec.outputs.tarih }}" && git push -q
